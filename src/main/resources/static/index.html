<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./reset.css" rel="stylesheet" />
    <link href="./global.css" rel="stylesheet" />
    <link href="./main.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="/"><img src="./img/signiture.svg" /></a>
        <ul class="header__menu">
          <li class="header__menu__item">
            <a class="btn btn_contained btn_size_s" href="/login/">로그인</a>
          </li>
          <li class="header__menu__item">
            <a class="btn btn_ghost btn_size_s" href="/registration/">
              회원 가입
            </a>
          </li>
        </ul>
      </header>
      <div class="wrapper">
        <div class="post">
          <div class="post__account">
            <img class="post__account__img" src="{{author_profile_image}}" />
            <p class="post__account__nickname">{{author_username}}</p>
          </div>
          <img class="post__img" src="{{article_image}}" />
          <div class="post__menu">
            <ul class="post__menu__personal">
              <li class="post__menu__item">
                <button class="post__menu__btn" onclick="likeArticle({{article_id}})">
                  <img src="./img/like.svg" />
                </button>
                <span id="like-count" class="post__menu__text">{{article_likes}}</span>
              </li>
              <li>
                <a class="post__menu__btn" href="/comment?articleId={{article_id}}">
                  <img src="./img/comment.svg" />
                </a>
              </li>
            </ul>
            <button class="post__menu__btn">
              <img src="./img/bookMark.svg" />
            </button>
          </div>
          <p class="post__article">
            {{article_content}}
          </p>
        </div>
        <ul class="comment">
          {{comments}}
          <button id="show-all-btn" class="btn btn_ghost btn_size_m" style="{{show_all_display}}" onclick="showAllComments()">
            모든 댓글 보기({{comment_count}}개)
          </button>
        </ul>
        <nav class="nav">
          <ul class="nav__menu">
            <li class="nav__menu__item">
              <a class="nav__menu__item__btn {{prevArticleClass}}" href="{{prevArticleLink}}">
                <img
                  class="nav__menu__item__img"
                  src="./img/ci_chevron-left.svg"
                />
                이전 글
              </a>
            </li>
            <li class="nav__menu__item">
              <a class="btn btn_ghost btn_size_m" href="/comment?articleId={{article_id}}">댓글 작성</a>
            </li>
            <li class="nav__menu__item">
              <a class="nav__menu__item__btn {{nextArticleClass}}" href="{{nextArticleLink}}">
                다음 글
                <img
                  class="nav__menu__item__img"
                  src="./img/ci_chevron-right.svg"
                />
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </body>
</html>
